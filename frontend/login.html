<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../css/estilo.css">
  <script src="../js/login.js" defer></script>
</head>
<body>

  <div class="container">
    <div class="form-box">
      <h2>Entrar</h2>
      <form id="formLogin">
        <div class="input-group">
          <label for="login-email">E-mail</label>
          <input name="email" type="email" id="login-email" placeholder="seu@email.com" required>
        </div>
        
        <div class="input-group">
          <label for="login-password">Senha</label>
          <input name="senha" type="password" id="login-password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn">Entrar</button>
      </form>
      
      <p class="switch-text">
        Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
      </p>
    </div>
  </div>

</body>
</html>
