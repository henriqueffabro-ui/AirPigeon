<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Inicial - Patriota Bird</title>
  <link rel="stylesheet" href="../css/estilo.css">
  <link rel="stylesheet" href="../css/pombos.css">
  <style>
    /* Estilos complementares específicos para a home */
    .home-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .patriota-img {
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn-secondary {
      background-image: none;
      background-color: transparent;
      color: #333;
      border: 2px solid purple;
    }

    .btn-secondary:hover {
      background-image: none;
      background-color: rgba(128, 0, 128, 0.1);
      color: purple;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-box home-content">
      <h2>AirPigeon</h2>
      <p class="subtitle">Bem-vindo à plataforma!</p>
      
      <img src="../imgs/patriota.jpeg" alt="Patriota Bird" class="patriota-img">

      <div class="button-group">
        <a href="login.html" style="text-decoration: none;">
          <button type="button" class="btn">Login</button>
        </a>
        <a href="cadastro.html" style="text-decoration: none;">
          <button type="button" class="btn btn-secondary">Cadastro</button>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
